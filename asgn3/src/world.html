<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Assignment 3: Virtual World</title>
</head>

<body onload="main()" style="display: flex; gap: 50px; align-items: flex-start; padding: 20px;">

    <div id="canvas-container">
        <canvas id="webgl" width="400" height="400">
            Please use a browser that supports "canvas"
        </canvas>

        <p><b>Controls:</b> Click the canvas to lock mouse. Press ESC to exit.</p>
        <p><b>W, A, S, D:</b> Move | <b>Mouse:</b> Look around | <b>R/T:</b> Fly Up/Down</p>
        <p><b>Z:</b> Place Block | <b>X:</b> Break Block</p>

        <h2 id="score">Diamonds Found: 0 / 5</h2>
        <p id="numdot">FPS: 0</p>

        <p>
            <label for="seedInput"><b>World Seed: </b></label>
            <input type="text" id="seedInput" value="BaseWorld">
            <button type="button" onclick="applySeed()">Generate World</button>
            <button type="button" onclick="resetWorld()">Reset to Base</button>
        </p>

    </div>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix.js"></script>
    <script src="triangle.js"></script>
    <script src="cube.js"></script>
    <script src="Camera.js"></script>
    <script src="asgn3.js"></script>

</body>

</html>
